services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: fiap-sdr-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build:
      context: ./backend

    container_name: fiap-sdr-backend

    ports:
      - "${BACKEND_PORT}:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}

    volumes:
      - ./data:/app/data:ro

    depends_on:
      - postgres
      
  frontend:
    build:
      context: ./frontend

    container_name: fiap-sdr-frontend

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:3000"

    depends_on:
      - backend


volumes:
  postgres_data: