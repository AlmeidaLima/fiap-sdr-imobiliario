services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: fiap-sdr-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend

    container_name: fiap-sdr-backend

    restart: unless-stopped

    ports:
      - "${BACKEND_PORT}:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      - postgres


  frontend:
    build:
      context: ./frontend

    container_name: fiap-sdr-frontend

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:3000"

    depends_on:
      - backend


volumes:
  postgres_data: